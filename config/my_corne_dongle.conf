# Dongle (central without keys): both halves connect to it as peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 5 BLE profiles + 2 peripherals
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# fetch battery levels of both halves (for the dongle display)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
